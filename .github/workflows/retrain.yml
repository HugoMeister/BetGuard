name: Retrain BetGuard Model (Weekly 7 Days Update)

on:
  schedule:
    - cron: '0 2 * * 0'    # Każda niedziela o 02:00
  workflow_dispatch:      # Ręczne uruchomienie też możliwe

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd MlService
          pip install -r requirements.txt

      - name: Retrain model (download → build → train → value)
        run: |
          python3 MlService/app/train_model.py

      - name: Commit retrained artifacts
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          git add .
          git commit -m "Auto-retrain: update model & dataset [skip ci]" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
